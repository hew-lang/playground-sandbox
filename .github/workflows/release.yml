name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable release tag to package
        type: string
        required: true

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify immutable release identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          test "v$(node -p "require('./package.json').version")" = "$RELEASE_TAG"
      - name: Install and test from public packages
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN NODE_AUTH_TOKEN NPM_TOKEN
          # Older tags resolved public engines through the authenticated mirror.
          # Keep their exact bytes: accept npmjs URLs only when integrity agrees.
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          for (const [key, entry] of Object.entries(lock.packages)) {
            if (!key.startsWith('node_modules/@hew-lang/')) continue;
            const name = key.slice('node_modules/'.length);
            if (!['@hew-lang/wasm', '@hew-lang/sandbox-vm'].includes(name)) throw new Error(`No public engine rule for ${name}`);
            const dist = JSON.parse(execFileSync('npm', ['view', `${name}@${entry.version}`, 'dist', '--json', '--@hew-lang:registry=https://registry.npmjs.org'], { encoding: 'utf8' }));
            if (entry.integrity !== dist.integrity || !dist.tarball.startsWith('https://registry.npmjs.org/')) throw new Error(`Public archive differs for ${name}`);
            entry.resolved = dist.tarball;
          }
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          fs.writeFileSync('.npmrc', '@hew-lang:registry=https://registry.npmjs.org/\n');
          NODE
          env -u GH_TOKEN -u GITHUB_TOKEN -u NODE_AUTH_TOKEN -u NPM_TOKEN npm ci --no-audit --no-fund
          env -u GH_TOKEN -u GITHUB_TOKEN -u NODE_AUTH_TOKEN -u NPM_TOKEN npm run test:sdk
      - name: Pack tested SDK archive
        shell: bash
        run: |
          set -euo pipefail
          npm pkg set "hewSource.commit=$(git rev-parse HEAD)" "hewSource.tag=$RELEASE_TAG"
          npm pkg set --json 'hewSource.dirty=false'
          mkdir -p "$RUNNER_TEMP/sdk-assets"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/sdk-assets"
          cd "$RUNNER_TEMP/sdk-assets"
          sha256sum ./*.tgz > SHA256SUMS
      - name: Publish versioned archives without replacing existing bytes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --json tagName >/dev/null; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          fi
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/existing-sdk-assets"
          mkdir -p "$RUNNER_TEMP/previous-sdk-assets"
          for file in "$RUNNER_TEMP/sdk-assets/"*; do
            name=$(basename "$file")
            if grep -Fxq "$name" "$RUNNER_TEMP/existing-sdk-assets"; then
              gh release download "$RELEASE_TAG" --pattern "$name" --dir "$RUNNER_TEMP/previous-sdk-assets"
              cmp "$file" "$RUNNER_TEMP/previous-sdk-assets/$name"
            fi
          done
          # Preflight every existing asset before changing the public release.
          # Upload archives before the checksum manifest on an incomplete release.
          for file in "$RUNNER_TEMP/sdk-assets/"*.tgz "$RUNNER_TEMP/sdk-assets/SHA256SUMS"; do
            name=$(basename "$file")
            if ! grep -Fxq "$name" "$RUNNER_TEMP/existing-sdk-assets"; then
              gh release upload "$RELEASE_TAG" "$file"
            fi
          done
